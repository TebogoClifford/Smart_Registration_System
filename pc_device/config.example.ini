# Copy to config.ini (kept out of git: it holds the device key) and fill in.
[srs]
url = https://smart-registration-system.onrender.com
device_id = 1
# administrators see the key on the device's page in the web console
device_key =
# webcam index, or auto
camera = auto
# Arduino port, e.g. COM3 (leave empty without an Arduino)
serial_port =
# faces narrower than this are "too far away"; raise it to make people step closer
min_face_px = 90
